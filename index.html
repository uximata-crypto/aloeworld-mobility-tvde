#fff;color:#0f172a}.dark input,.dark select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16)}.dark input::placeholder{color:#94a3b8}.dark option{color:#0f172a}.btn{border:0;border-radius:17px;padding:13px 16px;font-weight:950;cursor:pointer;background:#020617;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.green{background:var(--green);color:#020617}.btn.light{background:#f1f5f9;color:#334155}.btn.red{background:#fee2e2;color:#991b1b}.btn.amber{background:#fef3c7;color:#92400e}.btnline{display:flex;gap:9px;flex-wrap:wrap}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(255,255,255,.09);padding:8px;border-radius:20px;margin:18px 0}.tabs button{border:0;border-radius:14px;padding:13px;font-weight:950;background:transparent;color:#fff;cursor:pointer}.tabs button.active{background:#fff;color:#020617}.selector{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}.selector button{text-align:left;min-height:78px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.1);color:#fff;font-weight:950;padding:14px;cursor:pointer}.selector button.active{background:var(--green);color:#020617}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:950;background:#f1f5f9;color:#334155}.pill.ok{background:#d1fae5;color:#065f46}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.stat{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.num{font-size:28px;font-weight:950}.iconbox{min-width:46px;height:46px;border-radius:17px;background:#020617;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:22px;padding:18px}.success{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:22px;padding:18px;margin-bottom:18px}.hidden{display:none}.open-card{width:100%;border:0;background:#f8fafc;text-align:left;padding:20px;border-radius:22px;cursor:pointer;transition:.2s}.open-card:hover{background:#ecfdf5;transform:translateY(-2px)}.docbox{border:1px solid rgba(255,255,255,.14);border-radius:19px;background:rgba(255,255,255,.08);padding:16px;margin-top:15px}.docitem{border:1px solid rgba(255,255,255,.12);border-radius:17px;padding:13px;margin-top:10px;background:rgba(255,255,255,.06)}.docitem b{display:block;margin-bottom:8px}.formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.map-card{margin-top:18px}.map-toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:14px 0}.osm-map,.google-map{height:390px;border-radius:24px;overflow:hidden;border:1px solid #bfdbfe;background:#e0f2fe;box-shadow:inset 0 0 0 1px rgba(15,23,42,.05)}.map-status{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:14px;background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}.map-status.bad{background:#fff7ed;color:#9a3412;border-color:#fed7aa}.map-status.ok{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}.map-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.map-note{font-size:12px;color:#64748b;margin-top:8px}.dark .map-note{color:#cbd5e1}.map-card,.dark .map-card{background:#fff!important;color:#0f172a!important}.map-card h3,.dark .map-card h3{color:#0f172a!important}.map-card .muted,.dark .map-card .muted{color:#475569!important}.map-card label span,.dark .map-card label span{color:#334155!important}.map-card input,.dark .map-card input{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important}.map-card input::placeholder,.dark .map-card input::placeholder{color:#94a3b8!important}.map-toolbar .btn.green{color:#020617!important}.map-status,.dark .map-card .map-status{color:#1e3a8a!important}.map-status.ok,.dark .map-card .map-status.ok{color:#065f46!important}.map-status.bad,.dark .map-card .map-status.bad{color:#9a3412!important}.map-note,.dark .map-card .map-note{color:#64748b!important}@media(max-width:900px){.map-toolbar{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:13px;border-bottom:1px solid var(--line)}td{padding:13px;border-bottom:1px solid #f1f5f9;vertical-align:top}.tablewrap{overflow:auto}.config{border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:22px;padding:18px;margin:18px 0}.mini{font-size:12px}.warnline{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:16px;padding:12px;margin-top:10px}@media(max-width:900px){.grid2,.grid3,.grid4,.split,.selector,.formrow{grid-template-columns:1fr}h1{font-size:30px}}
  </style>
</head>
<body>
<div class="wrap">
<header><div class="hero"><div class="brand"><div class="logo">↗</div><div><p class="eyebrow">Plataforma TVDE</p><h1>ALOE - GO</h1><p class="tagline">Mobilidade TVDE transparente, segura e portuguesa.</p><p class="legal">Plataforma eletrónica TVDE independente dos veículos</p></div></div></div><nav id="nav"></nav></header>
<div id="msg" style="display:none" class="success"></div>
<section id="acesso" class="section active"></section>
<section id="geral" class="section"></section>
<section id="tabelas" class="section"></section>
<section id="compliance" class="section"></section>
<section id="admin" class="section"></section>
<section id="pagamentos" class="section"></section>
<section id="suporte" class="section"></section>
<section id="relatorios" class="section"></section>
<section id="configuracao" class="section"></section>
<footer class="card" style="margin-top:22px"><p class="muted">Versão com login real via Supabase, email real via Resend e mapas gratuitos via OpenStreetMap + Leaflet.</p></footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const tabs=[['acesso','Acesso'],['geral','Geral'],['tabelas','Tabelas'],['compliance','Compliance'],['admin','Admin'],['pagamentos','Pagamentos'],['suporte','Suporte'],['relatorios','Relatórios'],['configuracao','Configuração']];
const docs={operator:['Licença operador TVDE','Certidão permanente','Registo criminal da gerência','Seguro RC','Contrato de adesão'],driver:['Certificado CMTVDE','Carta de condução grupo 2','Registo criminal','Contrato com operador','Documento de identificação'],vehicle:['DUA / Documento único automóvel','Seguro','Inspeção periódica','Comprovativo de propriedade','Proposta de aluguer/parceria']};
const operators=[['OP-001','Operador Centro Premium, Lda.','TVDE-PT-20491','Aprovado','12','10'],['OP-002','Via Mondego Services, Lda.','TVDE-PT-21903','Em validação','5','4'],['OP-003','Turismo Executivo Atlântico, Lda.','TVDE-PT-22488','Aprovado','8','7']];
const drivers=[['M-TVDE-89345','João Martins','Operador Centro Premium, Lda.','Mercedes Classe C','AB-34-CD','Ativo'],['M-TVDE-76109','Maria Serra','Operador Centro Premium, Lda.','Tesla Model 3','EV-23-MB','Pendente'],['M-TVDE-69210','Pedro Almeida','Turismo Executivo Atlântico, Lda.','Peugeot 508','TV-91-DE','Ativo']];
const vehicles=[['VEI-001','Tesla Model 3','EV-23-MB','Particular','850 €/mês','A rever'],['VEI-002','Mercedes Classe C','AB-34-CD','Empresa','950 €/mês','Aprovado'],['VEI-003','Peugeot 508','TV-91-DE','Particular','720 €/mês','Pendente']];
let state={tab:'acesso',mode:'login',reg:'passenger',zoom:1,session:JSON.parse(localStorage.getItem('awm_session')||'null'),registrations:[['REG-PAS-001','Passageiro','Ana Silva','—','0/0','Pendente'],['REG-OP-001','Operador','Via Mondego Services, Lda.','—','4/5','Pendente'],['REG-MOT-001','Motorista','Maria Serra','Operador Centro Premium, Lda.','3/5','Pendente'],['REG-VEI-001','Veículo','Tesla Model 3 · EV-23-MB','Particular: Ana Martins','4/5','A rever']],audit:[['AUD-001','Validação documental','Operador Centro Premium, Lda.','Pendente','Aprovado']]};
function cls(status){return status==='Aprovado'||status==='Ativo'?'ok':status==='Rejeitado'||status==='Bloqueado'?'bad':'warn'}
function status(s){return `<span class="pill ${cls(s)}">${s}</span>`}
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${state.tab===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}
function setTab(t){state.tab=t;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(t).classList.add('active');nav();render()}
function setMode(m){state.mode=m;renderAcesso()}
function setReg(r){state.mode='register';state.reg=r;renderAcesso()}
function docsHtml(type){return `<div class="docbox"><h3>Upload de documentos obrigatórios</h3>${(docs[type]||[]).map(d=>`<div class="docitem"><b>${d}</b><input type="file"></div>`).join('')}</div>`}
const mapDefaults={
  passenger:{center:[40.2033,-8.4103],origin:'Praça da República, Coimbra, Portugal',destination:'Estação Coimbra-B, Coimbra, Portugal',zoom:13,emoji:'🧍'},
  driver:{center:[40.2088,-8.4292],origin:'Estação Coimbra-B, Coimbra, Portugal',destination:'Universidade de Coimbra, Coimbra, Portugal',zoom:13,emoji:'🚗'}
};
let osmMapInstances={};
function showMapStatus(id,msg,type=''){
  const el=document.getElementById('map-status-'+id);
  if(el){el.className='map-status '+type;el.textContent=msg;}
}
function initFreeMaps(){
  const nodes=[...document.querySelectorAll('.osm-map:not([data-ready="1"])')];
  if(!nodes.length) return;
  for(const el of nodes){
    const id=el.dataset.mapId;
    const type=el.dataset.mapType||'passenger';
    const cfg=mapDefaults[type]||mapDefaults.passenger;
    try{
      if(!window.L){throw new Error('Leaflet indisponível. Verifique a ligação à internet.');}
      const map=L.map(el,{scrollWheelZoom:true}).setView(cfg.center,cfg.zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom:19,
        attribution:'&copy; OpenStreetMap contributors'
      }).addTo(map);
      const markers=L.layerGroup().addTo(map);
      const routeLayer=L.layerGroup().addTo(map);
      osmMapInstances[id]={map,markers,routeLayer,type};
      el.dataset.ready='1';
      showMapStatus(id,'Mapa gratuito OpenStreetMap ligado. Pode usar zoom, localização atual e rota demonstrativa.','ok');
      setTimeout(()=>map.invalidateSize(),150);
      drawRoute(id);
    }catch(err){
      showMapStatus(id,err.message||'Mapa indisponível.','bad');
      el.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#1e3a8a;font-weight:900">Mapa gratuito indisponível. Verifique a ligação à internet.</div>';
    }
  }
}
async function geocodeFree(address){
  const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=0&q='+encodeURIComponent(address);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  const data=await res.json();
  if(!Array.isArray(data)||!data.length) throw new Error('Morada não encontrada: '+address);
  return [parseFloat(data[0].lat),parseFloat(data[0].lon)];
}
function haversineKm(a,b){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(b[0]-a[0]), dLon=toRad(b[1]-a[1]);
  const lat1=toRad(a[0]), lat2=toRad(b[0]);
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
async function drawRoute(id){
  const instance=osmMapInstances[id];
  if(!instance) return;
  const origin=document.getElementById('map-origin-'+id)?.value || mapDefaults[instance.type].origin;
  const destination=document.getElementById('map-destination-'+id)?.value || mapDefaults[instance.type].destination;
  showMapStatus(id,'A procurar moradas no OpenStreetMap...');
  try{
    const start=await geocodeFree(origin);
    const end=await geocodeFree(destination);
    instance.markers.clearLayers();
    instance.routeLayer.clearLayers();
    L.marker(start).addTo(instance.markers).bindPopup('Origem: '+origin);
    L.marker(end).addTo(instance.markers).bindPopup('Destino: '+destination);
    const line=L.polyline([start,end],{weight:5,opacity:.8}).addTo(instance.routeLayer);
    instance.map.fitBounds(line.getBounds(),{padding:[35,35]});
    const km=haversineKm(start,end);
    showMapStatus(id,`Rota demonstrativa OpenStreetMap: distância em linha reta aproximada ${km.toFixed(1)} km. Para rota rodoviária real, integrar OSRM/OpenRouteService.`, 'ok');
  }catch(err){
    showMapStatus(id,err.message||'Não foi possível traçar a rota. Confirme as moradas.','bad');
  }
}
function locateMe(id){
  const instance=osmMapInstances[id];
  if(!navigator.geolocation){showMapStatus(id,'O navegador não suporta geolocalização.','bad');return;}
  showMapStatus(id,'A obter localização atual...');
  navigator.geolocation.getCurrentPosition(pos=>{
    const p=[pos.coords.latitude,pos.coords.longitude];
    if(instance){
      L.marker(p).addTo(instance.markers).bindPopup('Localização atual').openPopup();
      instance.map.setView(p,15);
    }
    showMapStatus(id,'Localização atual marcada no mapa.','ok');
  },()=>showMapStatus(id,'Não foi possível obter a localização. Autorize a localização no navegador.','bad'));
}
function mapBlock(title,type='passenger'){
  const id='osm-'+type+'-'+Math.random().toString(36).slice(2,8);
  const cfg=mapDefaults[type]||mapDefaults.passenger;
  setTimeout(initFreeMaps,80);
  return `<div class="card map-card"><h3>${title}</h3><p class="muted">Mapa gratuito ligado ao OpenStreetMap + Leaflet, sem chave Google Maps e sem faturação Google.</p><div class="map-toolbar"><label><span>Origem</span><input id="map-origin-${id}" value="${cfg.origin}"></label><label><span>Destino</span><input id="map-destination-${id}" value="${cfg.destination}"></label><button class="btn green" type="button" onclick="drawRoute('${id}')">Traçar rota</button></div><div id="${id}" class="osm-map" data-map-id="${id}" data-map-type="${type}"></div><div id="map-status-${id}" class="map-status">A ligar ao OpenStreetMap...</div><div class="map-actions"><button class="btn light" type="button" onclick="locateMe('${id}')">Usar localização atual</button><button class="btn light" type="button" onclick="drawRoute('${id}')">Atualizar rota</button></div><p class="map-note">Uso recomendado para protótipo/fase inicial. Para rotas rodoviárias profissionais em produção, integrar serviço próprio/contratado de rotas.</p></div>`
}
function credentials(){return `<div class="formrow"><label><span>Username</span><input class="username" placeholder="Escolha um username"></label><label><span>Password</span><input class="password" type="password" placeholder="Crie uma password"></label></div>`}
function collectRegistrationPayload(type){
  const scope=document.getElementById('acesso');
  const allInputs=[...scope.querySelectorAll('input, select, textarea')];
  const getByClass=(cls)=>scope.querySelector('.'+cls)?.value?.trim() || '';
  return {
    tipo:type,
    nome:getByClass('nome'),
    email:scope.querySelector('input[type=email]')?.value?.trim() || '',
    username:getByClass('username'),
    password:getByClass('password'),
    telefone:getByClass('telefone') || allInputs.find(i=>/contacto|telefone/i.test(i.previousElementSibling?.innerText||''))?.value?.trim() || '',
    cidade:getByClass('cidade') || '',
    origem:'ALOE - GO',
    metadata:Object.fromEntries(allInputs.map((i,idx)=>[`campo_${idx+1}`,i.value]).filter(([,v])=>v))
  };
}
function saveSession(data){
  state.session=data;
  localStorage.setItem('awm_session',JSON.stringify(data));
}
function logoutReal(){
  state.session=null;
  localStorage.removeItem('awm_session');
  showMsg('<h3>Sessão terminada</h3><p>Terminou a sessão com sucesso.</p>');
  render();
}
function showMsg(html){
  const box=document.getElementById('msg');
  box.style.display='block';
  box.innerHTML=html;
  box.scrollIntoView({behavior:'smooth'});
}
async function loginReal(){
  const scope=document.getElementById('acesso');
  const login=scope.querySelector('.login-user')?.value?.trim() || '';
  const password=scope.querySelector('.login-password')?.value || '';
  if(!login){alert('Indique o username ou email.');return}
  if(!password){alert('Indique a password.');return}
  showMsg('<h3>A iniciar sessão...</h3><p>A validar credenciais na base de dados.</p>');
  try{
    const res=await fetch('/api/login-user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||'Login inválido.');
    saveSession(data);
    showMsg(`<h3>Login efetuado com sucesso</h3><p>Bem-vindo, <b>${data.profile?.nome||data.profile?.username||data.user?.email}</b>.</p><p class="mini">Perfil: ${data.profile?.role||'utilizador'}</p>`);
    render();
  }catch(err){
    showMsg(`<h3>Não foi possível iniciar sessão</h3><p><b>Motivo:</b> ${err.message}</p><p class="mini">Confirme username/email e password. Verifique também as variáveis SUPABASE no Vercel.</p>`);
  }
}
async function submitReg(type){
  const payload=collectRegistrationPayload(type);
  if(!payload.email){alert('Indique um email.');return}
  if(!payload.username){alert('Indique um username.');return}
  if(!payload.password || payload.password.length<6){alert('Indique uma password com pelo menos 6 caracteres.');return}
  showMsg(`<h3>A criar conta real...</h3><p>A gravar registo em Supabase e a enviar email para <b>${payload.email}</b>.</p>`);
  try{
    const res=await fetch('/api/register-user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||'Erro ao criar registo real.');
    showMsg(`<h3>Registo real criado com sucesso</h3><p>Tipo: <b>${payload.tipo}</b></p><p>Email: <b>${payload.email}</b></p><p>Username: <b>${payload.username}</b></p><p class="mini">ID Supabase: ${data.user_id||'criado'} · Email: ${data.email_sent?'enviado':'não enviado'}</p>`);
  }catch(err){
    showMsg(`<h3>Registo não concluído</h3><p><b>Motivo:</b> ${err.message}</p><p class="mini">Para registo real, configure SUPABASE_URL, SUPABASE_ANON_KEY e SUPABASE_SERVICE_ROLE_KEY no Vercel.</p>`);
  }
}
function sessionPanel(){
  if(!state.session) return '';
  const p=state.session.profile||{};
  return `<div class="success"><h3>Sessão ativa</h3><p>Utilizador: <b>${p.nome||p.username||state.session.user?.email}</b></p><p>Perfil: <b>${p.role||'utilizador'}</b> · Estado: <b>${p.estado||'pendente'}</b></p><div class="btnline"><button class="btn green" onclick="go('geral')">Entrar no painel</button><button class="btn light" onclick="logoutReal()">Terminar sessão</button></div></div>`;
}
function renderAcesso(){document.getElementById('acesso').innerHTML=sessionPanel()+`<div class="grid split"><div class="card dark"><h2>Acesso à plataforma</h2><p class="muted">Início de sessão e registo separado para passageiros, operadores, motoristas e veículos.</p><div class="tabs"><button class="${state.mode==='login'?'active':''}" onclick="setMode('login')">Iniciar sessão</button><button class="${state.mode==='register'?'active':''}" onclick="setMode('register')">Criar registo</button></div>${state.mode==='login'?loginForm():registerForm()}</div><div class="grid"><div class="card"><h2>Estrutura dos registos</h2><p class="muted">Clique numa opção para abrir o formulário.</p>${openCards()}</div><div class="notice"><h3>Nota legal importante</h3><p>Os veículos para aluguer/parceria são manifestação de interesse. A plataforma deve manter independência face aos veículos.</p></div></div></div>`;setTimeout(initFreeMaps,100)}
function loginForm(){return `<label><span>Username ou email</span><input class="login-user" placeholder="username ou email"></label><label><span>Password</span><input class="login-password" type="password" placeholder="••••••••"></label><button class="btn green" style="width:100%" onclick="loginReal()">Entrar na plataforma</button><p class="map-note">Login real ligado ao Supabase Auth. O utilizador precisa de estar registado.</p>`}
function openCards(){return [['passenger','1. Registo de Passageiros','Nome, email, contacto telefónico, cidade, username e password.','Abrir formulário de passageiro'],['operator','2. Registo de Operadores','Empresa, licença TVDE, documentos e credenciais.','Abrir formulário de operador'],['driver','3. Registo de Motoristas','CMTVDE, operador associado, documentos e credenciais.','Abrir formulário de motorista'],['vehicle','4. Veículos para aluguer/parceria','Proprietário, matrícula, seguro, valor e documentos.','Abrir formulário de veículo']].map(x=>`<button class="open-card" onclick="setReg('${x[0]}')"><h3>✅ ${x[1]}</h3><p class="muted">${x[2]}</p><span class="btn">${x[3]} ›</span></button>`).join('')}
function registerForm(){let selector=`<div class="selector">${[['passenger','🧍','Passageiro'],['operator','🏢','Operador TVDE'],['driver','👤','Motorista'],['vehicle','🚘','Veículo para aluguer']].map(x=>`<button class="${state.reg===x[0]?'active':''}" onclick="setReg('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</div>`;let f='';if(state.reg==='passenger'){f=`<div class="notice" style="background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);color:#cbd5e1">Registo simples de passageiro. Não necessita de upload de documentos.</div><label><span>Nome completo</span><input class="nome" placeholder="Nome do passageiro"></label><div class="formrow"><label><span>Email</span><input type="email" placeholder="email@exemplo.pt"></label><label><span>Contacto telefónico</span><input class="telefone" placeholder="+351 900 000 000"></label></div><label><span>Cidade</span><input class="cidade" placeholder="Ex.: Coimbra"></label>${credentials()}<button class="btn green" style="width:100%" onclick="submitReg('passageiro')">Submeter registo de passageiro</button>${mapBlock('Mapa da viagem do passageiro','passenger')}`}
if(state.reg==='operator'){f=`<label><span>Nome da empresa</span><input class="nome" placeholder="Operador Centro Premium, Lda."></label><div class="formrow"><label><span>NIF/NIPC</span><input></label><label><span>N.º licença TVDE</span><input placeholder="TVDE-PT-00000"></label></div><div class="formrow"><label><span>Gerente/responsável</span><input></label><label><span>Email</span><input type="email"></label></div>${credentials()}${docsHtml('operator')}<button class="btn green" style="width:100%" onclick="submitReg('operador')">Submeter registo de operador</button>`}
if(state.reg==='driver'){f=`<label><span>Nome do motorista</span><input class="nome"></label><div class="formrow"><label><span>Email</span><input type="email"></label><label><span>Contacto telefónico</span><input></label></div><div class="formrow"><label><span>N.º certificado CMTVDE</span><input></label><label><span>Carta de condução</span><input></label></div><label><span>Operador TVDE associado validado</span><select><option>Operador Centro Premium, Lda. · TVDE-PT-20491</option><option>Turismo Executivo Atlântico, Lda. · TVDE-PT-22488</option></select></label>${credentials()}${docsHtml('driver')}<button class="btn green" style="width:100%" onclick="submitReg('motorista')">Submeter registo de motorista</button>${mapBlock('Mapa operacional do motorista','driver')}`}
if(state.reg==='vehicle'){f=`<label><span>Tipo de proprietário</span><select><option>Empresa</option><option>Particular</option></select></label><div class="formrow"><label><span>Nome / entidade proprietária</span><input class="nome"></label><label><span>Email</span><input type="email"></label></div><div class="formrow"><label><span>Matrícula</span><input placeholder="AA-00-AA"></label><label><span>Ano</span><input></label></div><div class="formrow"><label><span>Marca</span><input></label><label><span>Modelo</span><input></label></div><div class="formrow"><label><span>Seguro</span><input></label><label><span>Valor pretendido de aluguer</span><input placeholder="700 €/mês"></label></div>${credentials()}${docsHtml('vehicle')}<button class="btn green" style="width:100%" onclick="submitReg('veículo')">Submeter veículo para análise</button>`}
return selector+f}
function table(rows,heads){return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===r.length-1?status(c):c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function render(){renderAcesso();document.getElementById('geral').innerHTML=`<h2>Painel geral</h2><div class="grid grid4"><div class="card stat"><div><p class="muted">Viagens no mês</p><div class="num">3 482</div></div><div class="iconbox">🚗</div></div><div class="card stat"><div><p class="muted">Faturação</p><div class="num">42 930 €</div></div><div class="iconbox">🧾</div></div><div class="card stat"><div><p class="muted">Motoristas ativos</p><div class="num">126</div></div><div class="iconbox">👤</div></div><div class="card stat"><div><p class="muted">Compliance</p><div class="num">94%</div></div><div class="iconbox">✅</div></div></div><div class="warnline">Os valores são demonstrativos. Relatórios reais exigem base de dados e backend.</div>`;document.getElementById('tabelas').innerHTML=`<h2>Tabelas operacionais</h2><div class="grid"><div class="card"><h3>Operadores</h3>${table(operators,['ID','Empresa','Licença','Estado','Motoristas','Viaturas'])}</div><div class="card"><h3>Motoristas</h3>${table(drivers,['ID','Nome','Operador','Viatura','Matrícula','Estado'])}</div><div class="card"><h3>Bolsa de veículos</h3>${table(vehicles,['ID','Veículo','Matrícula','Proprietário','Valor','Estado'])}</div></div>`;document.getElementById('compliance').innerHTML=`<h2>Compliance</h2><div class="grid grid4"><div class="card stat"><div><p class="muted">Documentos</p><div class="num">418</div></div><div class="iconbox">📄</div></div><div class="card stat"><div><p class="muted">Alertas</p><div class="num">6</div></div><div class="iconbox">⚠️</div></div></div><div class="notice"><h3>Módulos reais pendentes</h3><p>API, base de dados, autenticação, mapas reais, pagamentos e relatórios reais ainda precisam de integração.</p></div>`;document.getElementById('admin').innerHTML=`<h2>Admin</h2><div class="grid split"><div class="card"><h3>Registos e aprovação manual</h3>${table(state.registrations,['ID','Tipo','Nome','Ligação','Docs','Estado'])}<div class="btnline" style="margin-top:14px"><button class="btn green" onclick="changeStatus('Aprovado')">Aprovar primeiro pendente</button><button class="btn amber" onclick="changeStatus('A rever')">Rever primeiro pendente</button><button class="btn red" onclick="changeStatus('Rejeitado')">Rejeitar primeiro pendente</button></div></div><div class="card"><h3>Histórico de auditoria</h3>${state.audit.map(a=>`<div class="card" style="box-shadow:none;margin:10px 0"><b>${a[1]}</b><p class="muted">${a[2]} · ${a[3]} → ${a[4]}</p></div>`).join('')}</div></div>`;document.getElementById('pagamentos').innerHTML=`<h2>Pagamentos</h2><div class="config"><h3>Pagamentos reais ainda não ligados</h3><p>Necessário Stripe, SIBS, EuPago, Ifthenpay ou outro PSP com API keys e webhooks.</p></div>`;document.getElementById('suporte').innerHTML=`<h2>Suporte</h2><div class="grid grid3"><div class="card"><h3>Centro de ajuda</h3><p class="muted">Chat/email/telefone.</p></div><div class="card"><h3>Botão SOS</h3><p class="muted">Partilha de localização.</p></div><div class="card"><h3>Reclamações</h3><p class="muted">Livro e RAL.</p></div></div>`;document.getElementById('relatorios').innerHTML=`<h2>Relatórios</h2><div class="config"><h3>Relatórios reais dependem da base de dados Supabase</h3><p>Os mapas financeiros e operacionais precisam de viagens, pagamentos e comissões reais gravadas.</p></div>`;document.getElementById('configuracao').innerHTML=`<h2>Configuração técnica para produção</h2><p class="muted">O que falta para a plataforma funcionar realmente.</p><div class="grid grid2"><div class="config"><h3>Email real</h3><p>Vercel Function + Resend. Configurar RESEND_API_KEY, EMAIL_FROM e ADMIN_EMAIL.</p></div><div class="config"><h3>Base de dados</h3><p>Supabase/PostgreSQL: operadores, motoristas, passageiros, veículos, documentos, auditoria, viagens e pagamentos.</p></div><div class="config"><h3>Autenticação</h3><p>Login real com Supabase Auth, username/email e password.</p></div><div class="config"><h3>Mapas gratuitos ligados</h3><p>OpenStreetMap + Leaflet sem chave API e sem faturação Google.</p></div><div class="config"><h3>Pagamentos reais</h3><p>Stripe/SIBS/EuPago/Ifthenpay + webhooks.</p></div><div class="config"><h3>API</h3><p>Backend para gravar dados, validar documentos, aprovar registos e gerar relatórios.</p></div></div>`;}
function changeStatus(s){let item=state.registrations.find(r=>r[5]!=='Aprovado');if(item){state.audit.unshift(['AUD-'+(state.audit.length+1),'Alteração de estado',item[2],item[5],s]);item[5]=s;render();}}
nav();render();
</script>
</body>
</html>
