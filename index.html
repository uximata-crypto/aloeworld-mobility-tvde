<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aloeworld Mobility — Plataforma TVDE</title>
  <style>
    :root{--bg:#f1f5f9;--dark:#020617;--card:#fff;--muted:#64748b;--line:#e2e8f0;--green:#34d399;--amber:#f59e0b;--red:#ef4444;--blue:#2563eb;--radius:22px;--shadow:0 10px 28px rgba(15,23,42,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:#0f172a}.wrap{max-width:1280px;margin:0 auto;padding:24px}header{background:var(--dark);color:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:22px}.hero{padding:30px}.brand{display:flex;gap:16px;align-items:center}.logo{width:60px;height:60px;border-radius:20px;background:var(--green);color:#020617;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:950}.eyebrow{color:var(--green);font-size:13px;font-weight:950;text-transform:uppercase;letter-spacing:.22em;margin:0 0 6px}h1{font-size:38px;margin:0;font-weight:950}h2{font-size:27px;margin:0 0 8px;font-weight:950}h3{font-size:19px;margin:0 0 8px;font-weight:950}.tagline{color:#cbd5e1;margin:8px 0 0}.legal{color:var(--green);font-size:13px;font-weight:900;margin:5px 0 0}nav{display:flex;gap:8px;overflow:auto;background:#fff;padding:12px}nav button{border:0;border-radius:18px;padding:13px 17px;font-weight:950;background:#f1f5f9;color:#475569;cursor:pointer;white-space:nowrap}nav button.active{background:#020617;color:#fff}.section{display:none}.section.active{display:block}.grid{display:grid;gap:18px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.dark{background:linear-gradient(135deg,#020617,#1e293b);color:#fff;border:0}.muted{color:var(--muted);line-height:1.55}.dark .muted{color:#cbd5e1}label{display:block;margin-bottom:13px}label span{display:block;font-size:13px;font-weight:850;margin-bottom:6px;color:#475569}.dark label span{color:#cbd5e1}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:17px;padding:13px 15px;font-size:14px;outline:none;background:#fff;color:#0f172a}.dark input,.dark select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16)}.dark input::placeholder{color:#94a3b8}.dark option{color:#0f172a}.btn{border:0;border-radius:17px;padding:13px 16px;font-weight:950;cursor:pointer;background:#020617;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.green{background:var(--green);color:#020617}.btn.light{background:#f1f5f9;color:#334155}.btn.red{background:#fee2e2;color:#991b1b}.btn.amber{background:#fef3c7;color:#92400e}.btnline{display:flex;gap:9px;flex-wrap:wrap}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(255,255,255,.09);padding:8px;border-radius:20px;margin:18px 0}.tabs button{border:0;border-radius:14px;padding:13px;font-weight:950;background:transparent;color:#fff;cursor:pointer}.tabs button.active{background:#fff;color:#020617}.selector{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}.selector button{text-align:left;min-height:78px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.1);color:#fff;font-weight:950;padding:14px;cursor:pointer}.selector button.active{background:var(--green);color:#020617}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:950;background:#f1f5f9;color:#334155}.pill.ok{background:#d1fae5;color:#065f46}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.stat{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.num{font-size:28px;font-weight:950}.iconbox{min-width:46px;height:46px;border-radius:17px;background:#020617;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:22px;padding:18px}.success{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:22px;padding:18px;margin-bottom:18px}.hidden{display:none}.open-card{width:100%;border:0;background:#f8fafc;text-align:left;padding:20px;border-radius:22px;cursor:pointer;transition:.2s}.open-card:hover{background:#ecfdf5;transform:translateY(-2px)}.docbox{border:1px solid rgba(255,255,255,.14);border-radius:19px;background:rgba(255,255,255,.08);padding:16px;margin-top:15px}.docitem{border:1px solid rgba(255,255,255,.12);border-radius:17px;padding:13px;margin-top:10px;background:rgba(255,255,255,.06)}.docitem b{display:block;margin-bottom:8px}.formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.map{height:360px;border-radius:24px;background:linear-gradient(135deg,#dbeafe,#f8fafc);position:relative;overflow:hidden;border:1px solid #bfdbfe;transform-origin:center}.map::before{content:"";position:absolute;inset:-20px;background:repeating-linear-gradient(35deg,transparent 0 42px,rgba(37,99,235,.14) 43px 46px),repeating-linear-gradient(120deg,transparent 0 54px,rgba(15,23,42,.10) 55px 58px)}.route{position:absolute;left:18%;top:58%;width:62%;height:7px;background:#2563eb;border-radius:999px;transform:rotate(-18deg);box-shadow:0 0 0 6px rgba(37,99,235,.12)}.marker{position:absolute;width:48px;height:48px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:950;box-shadow:0 12px 24px rgba(15,23,42,.18);z-index:2}.driver{left:24%;top:52%;background:#dcfce7}.passenger{left:68%;top:30%;background:#dbeafe}.vehicle{left:48%;top:72%;background:#fef3c7}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:13px;border-bottom:1px solid var(--line)}td{padding:13px;border-bottom:1px solid #f1f5f9;vertical-align:top}.tablewrap{overflow:auto}.config{border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:22px;padding:18px;margin:18px 0}.mini{font-size:12px}.warnline{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:16px;padding:12px;margin-top:10px}@media(max-width:900px){.grid2,.grid3,.grid4,.split,.selector,.formrow{grid-template-columns:1fr}h1{font-size:30px}}
  </style>
</head>
<body>
<div class="wrap">
<header><div class="hero"><div class="brand"><div class="logo">↗</div><div><p class="eyebrow">Plataforma TVDE</p><h1>Aloeworld Mobility</h1><p class="tagline">Mobilidade TVDE transparente, segura e portuguesa.</p><p class="legal">Plataforma eletrónica TVDE independente dos veículos</p></div></div></div><nav id="nav"></nav></header>
<div id="msg" style="display:none" class="success"></div>
<section id="acesso" class="section active"></section>
<section id="geral" class="section"></section>
<section id="tabelas" class="section"></section>
<section id="compliance" class="section"></section>
<section id="admin" class="section"></section>
<section id="pagamentos" class="section"></section>
<section id="suporte" class="section"></section>
<section id="relatorios" class="section"></section>
<section id="configuracao" class="section"></section>
<footer class="card" style="margin-top:22px"><p class="muted">Versão final para GitHub + Vercel. O front-end funciona em HTML. Para email real, usar Vercel Functions com Resend configurado nas variáveis de ambiente.</p></footer>
</div>
<script>
const tabs=[['acesso','Acesso'],['geral','Geral'],['tabelas','Tabelas'],['compliance','Compliance'],['admin','Admin'],['pagamentos','Pagamentos'],['suporte','Suporte'],['relatorios','Relatórios'],['configuracao','Configuração']];
const docs={operator:['Licença operador TVDE','Certidão permanente','Registo criminal da gerência','Seguro RC','Contrato de adesão'],driver:['Certificado CMTVDE','Carta de condução grupo 2','Registo criminal','Contrato com operador','Documento de identificação'],vehicle:['DUA / Documento único automóvel','Seguro','Inspeção periódica','Comprovativo de propriedade','Proposta de aluguer/parceria']};
const operators=[['OP-001','Operador Centro Premium, Lda.','TVDE-PT-20491','Aprovado','12','10'],['OP-002','Via Mondego Services, Lda.','TVDE-PT-21903','Em validação','5','4'],['OP-003','Turismo Executivo Atlântico, Lda.','TVDE-PT-22488','Aprovado','8','7']];
const drivers=[['M-TVDE-89345','João Martins','Operador Centro Premium, Lda.','Mercedes Classe C','AB-34-CD','Ativo'],['M-TVDE-76109','Maria Serra','Operador Centro Premium, Lda.','Tesla Model 3','EV-23-MB','Pendente'],['M-TVDE-69210','Pedro Almeida','Turismo Executivo Atlântico, Lda.','Peugeot 508','TV-91-DE','Ativo']];
const vehicles=[['VEI-001','Tesla Model 3','EV-23-MB','Particular','850 €/mês','A rever'],['VEI-002','Mercedes Classe C','AB-34-CD','Empresa','950 €/mês','Aprovado'],['VEI-003','Peugeot 508','TV-91-DE','Particular','720 €/mês','Pendente']];
let state={tab:'acesso',mode:'login',reg:'passenger',zoom:1,registrations:[['REG-PAS-001','Passageiro','Ana Silva','—','0/0','Pendente'],['REG-OP-001','Operador','Via Mondego Services, Lda.','—','4/5','Pendente'],['REG-MOT-001','Motorista','Maria Serra','Operador Centro Premium, Lda.','3/5','Pendente'],['REG-VEI-001','Veículo','Tesla Model 3 · EV-23-MB','Particular: Ana Martins','4/5','A rever']],audit:[['AUD-001','Validação documental','Operador Centro Premium, Lda.','Pendente','Aprovado']]};
function cls(status){return status==='Aprovado'||status==='Ativo'?'ok':status==='Rejeitado'||status==='Bloqueado'?'bad':'warn'}
function status(s){return `<span class="pill ${cls(s)}">${s}</span>`}
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${state.tab===t[0]?'active':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}
function setTab(t){state.tab=t;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(t).classList.add('active');nav();render()}
function setMode(m){state.mode=m;renderAcesso()}
function setReg(r){state.mode='register';state.reg=r;renderAcesso()}
function docsHtml(type){return `<div class="docbox"><h3>Upload de documentos obrigatórios</h3>${(docs[type]||[]).map(d=>`<div class="docitem"><b>${d}</b><input type="file"></div>`).join('')}</div>`}
function mapBlock(title){return `<div class="card"><h3>${title}</h3><p class="muted">Mapa visual estilo Google Maps com rota simulada, marcadores e zoom. Para mapa real: Google Maps API ou Mapbox API.</p><div id="mapbox" class="map" style="transform:scale(${state.zoom})"><div class="route"></div><div class="marker driver">🚗</div><div class="marker passenger">🧍</div><div class="marker vehicle">🚘</div></div><div class="btnline" style="margin-top:14px"><button class="btn light" onclick="zoom(.1)">Zoom +</button><button class="btn light" onclick="zoom(-.1)">Zoom -</button></div></div>`}
function zoom(v){state.zoom=Math.max(.8,Math.min(1.3,state.zoom+v));renderAcesso()}
function credentials(){return `<div class="formrow"><label><span>Username</span><input class="username" placeholder="Escolha um username"></label><label><span>Password</span><input class="password" type="password" placeholder="Crie uma password"></label></div>`}
function collectRegistrationPayload(type){
  const scope=document.getElementById('acesso');
  return {
    tipo:type,
    nome:scope.querySelector('.nome')?.value || '',
    email:scope.querySelector('input[type=email]')?.value || '',
    username:scope.querySelector('.username')?.value || '',
    password:scope.querySelector('.password')?.value || '',
    origem:'Aloeworld Mobility TVDE'
  };
}
async function submitReg(type){
  const payload=collectRegistrationPayload(type);
  if(!payload.email){alert('Indique um email.');return}
  if(!payload.username){alert('Indique um username.');return}
  if(!payload.password){alert('Indique uma password.');return}
  const box=document.getElementById('msg');
  box.style.display='block';
  box.innerHTML=`<h3>A enviar registo...</h3><p>A preparar envio para <b>${payload.email}</b>.</p>`;
  box.scrollIntoView({behavior:'smooth'});
  try{
    const res=await fetch('/api/send-registration-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||'Erro no envio real de email.');
    box.innerHTML=`<h3>Registo submetido e email enviado</h3><p>Tipo: <b>${payload.tipo}</b></p><p>Email: <b>${payload.email}</b></p><p>Username: <b>${payload.username}</b></p><p class="mini">ID de envio: ${data.id||'confirmado'}</p>`;
  }catch(err){
    box.innerHTML=`<h3>Registo submetido em teste</h3><p>O formulário está funcional, mas o email real ainda não foi enviado.</p><p><b>Motivo:</b> ${err.message}</p><p class="mini">Para envio real, publicar no Vercel e configurar RESEND_API_KEY e EMAIL_FROM.</p>`;
  }
}
function renderAcesso(){document.getElementById('acesso').innerHTML=`<div class="grid split"><div class="card dark"><h2>Acesso à plataforma</h2><p class="muted">Início de sessão e registo separado para passageiros, operadores, motoristas e veículos.</p><div class="tabs"><button class="${state.mode==='login'?'active':''}" onclick="setMode('login')">Iniciar sessão</button><button class="${state.mode==='register'?'active':''}" onclick="setMode('register')">Criar registo</button></div>${state.mode==='login'?loginForm():registerForm()}</div><div class="grid"><div class="card"><h2>Estrutura dos registos</h2><p class="muted">Clique numa opção para abrir o formulário.</p>${openCards()}</div><div class="notice"><h3>Nota legal importante</h3><p>Os veículos para aluguer/parceria são manifestação de interesse. A plataforma deve manter independência face aos veículos.</p></div></div></div>`}
function loginForm(){return `<label><span>Username ou email</span><input placeholder="username ou email"></label><label><span>Password</span><input type="password" placeholder="••••••••"></label><button class="btn green" style="width:100%" onclick="alert('Login visual testado. Para login real é preciso autenticação/backend.')">Entrar na plataforma</button>`}
function openCards(){return [['passenger','1. Registo de Passageiros','Nome, email, contacto telefónico, cidade, username e password.','Abrir formulário de passageiro'],['operator','2. Registo de Operadores','Empresa, licença TVDE, documentos e credenciais.','Abrir formulário de operador'],['driver','3. Registo de Motoristas','CMTVDE, operador associado, documentos e credenciais.','Abrir formulário de motorista'],['vehicle','4. Veículos para aluguer/parceria','Proprietário, matrícula, seguro, valor e documentos.','Abrir formulário de veículo']].map(x=>`<button class="open-card" onclick="setReg('${x[0]}')"><h3>✅ ${x[1]}</h3><p class="muted">${x[2]}</p><span class="btn">${x[3]} ›</span></button>`).join('')}
function registerForm(){let selector=`<div class="selector">${[['passenger','🧍','Passageiro'],['operator','🏢','Operador TVDE'],['driver','👤','Motorista'],['vehicle','🚘','Veículo para aluguer']].map(x=>`<button class="${state.reg===x[0]?'active':''}" onclick="setReg('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</div>`;let f='';if(state.reg==='passenger'){f=`<div class="notice" style="background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);color:#cbd5e1">Registo simples de passageiro. Não necessita de upload de documentos.</div><label><span>Nome completo</span><input class="nome" placeholder="Nome do passageiro"></label><div class="formrow"><label><span>Email</span><input type="email" placeholder="email@exemplo.pt"></label><label><span>Contacto telefónico</span><input placeholder="+351 900 000 000"></label></div><label><span>Cidade</span><input placeholder="Ex.: Coimbra"></label>${credentials()}<button class="btn green" style="width:100%" onclick="submitReg('passageiro')">Submeter registo de passageiro</button>${mapBlock('Mapa da viagem do passageiro')}`}
if(state.reg==='operator'){f=`<label><span>Nome da empresa</span><input class="nome" placeholder="Operador Centro Premium, Lda."></label><div class="formrow"><label><span>NIF/NIPC</span><input></label><label><span>N.º licença TVDE</span><input placeholder="TVDE-PT-00000"></label></div><div class="formrow"><label><span>Gerente/responsável</span><input></label><label><span>Email</span><input type="email"></label></div>${credentials()}${docsHtml('operator')}<button class="btn green" style="width:100%" onclick="submitReg('operador')">Submeter registo de operador</button>`}
if(state.reg==='driver'){f=`<label><span>Nome do motorista</span><input class="nome"></label><div class="formrow"><label><span>Email</span><input type="email"></label><label><span>Contacto telefónico</span><input></label></div><div class="formrow"><label><span>N.º certificado CMTVDE</span><input></label><label><span>Carta de condução</span><input></label></div><label><span>Operador TVDE associado validado</span><select><option>Operador Centro Premium, Lda. · TVDE-PT-20491</option><option>Turismo Executivo Atlântico, Lda. · TVDE-PT-22488</option></select></label>${credentials()}${docsHtml('driver')}<button class="btn green" style="width:100%" onclick="submitReg('motorista')">Submeter registo de motorista</button>${mapBlock('Mapa operacional do motorista')}`}
if(state.reg==='vehicle'){f=`<label><span>Tipo de proprietário</span><select><option>Empresa</option><option>Particular</option></select></label><div class="formrow"><label><span>Nome / entidade proprietária</span><input class="nome"></label><label><span>Email</span><input type="email"></label></div><div class="formrow"><label><span>Matrícula</span><input placeholder="AA-00-AA"></label><label><span>Ano</span><input></label></div><div class="formrow"><label><span>Marca</span><input></label><label><span>Modelo</span><input></label></div><div class="formrow"><label><span>Seguro</span><input></label><label><span>Valor pretendido de aluguer</span><input placeholder="700 €/mês"></label></div>${credentials()}${docsHtml('vehicle')}<button class="btn green" style="width:100%" onclick="submitReg('veículo')">Submeter veículo para análise</button>`}
return selector+f}
function table(rows,heads){return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===r.length-1?status(c):c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function render(){renderAcesso();document.getElementById('geral').innerHTML=`<h2>Painel geral</h2><div class="grid grid4"><div class="card stat"><div><p class="muted">Viagens no mês</p><div class="num">3 482</div></div><div class="iconbox">🚗</div></div><div class="card stat"><div><p class="muted">Faturação</p><div class="num">42 930 €</div></div><div class="iconbox">🧾</div></div><div class="card stat"><div><p class="muted">Motoristas ativos</p><div class="num">126</div></div><div class="iconbox">👤</div></div><div class="card stat"><div><p class="muted">Compliance</p><div class="num">94%</div></div><div class="iconbox">✅</div></div></div><div class="warnline">Os valores são demonstrativos. Relatórios reais exigem base de dados e backend.</div>`;document.getElementById('tabelas').innerHTML=`<h2>Tabelas operacionais</h2><div class="grid"><div class="card"><h3>Operadores</h3>${table(operators,['ID','Empresa','Licença','Estado','Motoristas','Viaturas'])}</div><div class="card"><h3>Motoristas</h3>${table(drivers,['ID','Nome','Operador','Viatura','Matrícula','Estado'])}</div><div class="card"><h3>Bolsa de veículos</h3>${table(vehicles,['ID','Veículo','Matrícula','Proprietário','Valor','Estado'])}</div></div>`;document.getElementById('compliance').innerHTML=`<h2>Compliance</h2><div class="grid grid4"><div class="card stat"><div><p class="muted">Documentos</p><div class="num">418</div></div><div class="iconbox">📄</div></div><div class="card stat"><div><p class="muted">Alertas</p><div class="num">6</div></div><div class="iconbox">⚠️</div></div></div><div class="notice"><h3>Módulos reais pendentes</h3><p>API, base de dados, autenticação, mapas reais, pagamentos e relatórios reais ainda precisam de integração.</p></div>`;document.getElementById('admin').innerHTML=`<h2>Admin</h2><div class="grid split"><div class="card"><h3>Registos e aprovação manual</h3>${table(state.registrations,['ID','Tipo','Nome','Ligação','Docs','Estado'])}<div class="btnline" style="margin-top:14px"><button class="btn green" onclick="changeStatus('Aprovado')">Aprovar primeiro pendente</button><button class="btn amber" onclick="changeStatus('A rever')">Rever primeiro pendente</button><button class="btn red" onclick="changeStatus('Rejeitado')">Rejeitar primeiro pendente</button></div></div><div class="card"><h3>Histórico de auditoria</h3>${state.audit.map(a=>`<div class="card" style="box-shadow:none;margin:10px 0"><b>${a[1]}</b><p class="muted">${a[2]} · ${a[3]} → ${a[4]}</p></div>`).join('')}</div></div>`;document.getElementById('pagamentos').innerHTML=`<h2>Pagamentos</h2><div class="config"><h3>Pagamentos reais ainda não ligados</h3><p>Necessário Stripe, SIBS, EuPago, Ifthenpay ou outro PSP com API keys e webhooks.</p></div>`;document.getElementById('suporte').innerHTML=`<h2>Suporte</h2><div class="grid grid3"><div class="card"><h3>Centro de ajuda</h3><p class="muted">Chat/email/telefone.</p></div><div class="card"><h3>Botão SOS</h3><p class="muted">Partilha de localização.</p></div><div class="card"><h3>Reclamações</h3><p class="muted">Livro e RAL.</p></div></div>`;document.getElementById('relatorios').innerHTML=`<h2>Relatórios</h2><div class="config"><h3>Relatórios reais dependem de base de dados</h3><p>Os mapas financeiros e operacionais precisam de viagens, pagamentos e comissões reais gravadas.</p></div>`;document.getElementById('configuracao').innerHTML=`<h2>Configuração técnica para produção</h2><p class="muted">O que falta para a plataforma funcionar realmente.</p><div class="grid grid2"><div class="config"><h3>Email real</h3><p>Vercel Function + Resend. Configurar RESEND_API_KEY, EMAIL_FROM e ADMIN_EMAIL.</p></div><div class="config"><h3>Base de dados</h3><p>Supabase/PostgreSQL: operadores, motoristas, passageiros, veículos, documentos, auditoria, viagens e pagamentos.</p></div><div class="config"><h3>Autenticação</h3><p>Login real com username/password, recuperação e confirmação de email.</p></div><div class="config"><h3>Mapas reais</h3><p>Google Maps API
